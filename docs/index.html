<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Ranch wildlife monitoring system with grouped daily sightings and event photos." />
  <meta name="theme-color" content="#0b0f14" />
  <title>Ranch Events | Wildlife Monitoring</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" aria-label="Ranch Events">
        <div class="brand-mark" aria-hidden="true">RE</div>
        <div class="brand-copy">
          <div class="brand-name">Ranch Events</div>
          <div class="brand-kicker">Wildlife intelligence</div>
        </div>
      </div>

      <div class="header-actions">
        <div class="stats" aria-label="Event summary">
          <div class="stat">
            <div class="stat-label">Events</div>
            <div id="statEvents" class="stat-value">—</div>
          </div>
          <div class="stat">
            <div class="stat-label">Photos</div>
            <div id="statPhotos" class="stat-value">—</div>
          </div>
          <div class="stat">
            <div class="stat-label">Days</div>
            <div id="statDays" class="stat-value">—</div>
          </div>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch color theme">
          <span class="theme-toggle-label">Theme</span>
          <span id="themeToggleValue" class="theme-toggle-value">Auto</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="page-heading" aria-labelledby="pageTitle">
      <div>
        <div class="eyebrow">Activity archive</div>
        <h1 id="pageTitle">Recorded ranch events</h1>
        <p id="meta" class="meta">Loading event summary…</p>
      </div>
    </section>

    <div id="app" class="app" aria-live="polite">
      <div class="loading-state">
        <div class="loading-line loading-line-wide"></div>
        <div class="loading-line"></div>
        <div class="loading-grid">
          <div class="loading-card"></div>
          <div class="loading-card"></div>
          <div class="loading-card"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-overlay" id="modalOverlay" aria-hidden="true"></div>
    <div class="modal-card" role="document">
      <div class="modal-head">
        <div>
          <div class="eyebrow">Event details</div>
          <h2 id="modalTitle" class="modal-title"></h2>
        </div>
        <button id="modalClose" class="icon-btn" type="button" aria-label="Close event details" title="Close">×</button>
      </div>
      <div id="modalSub" class="modal-sub"></div>
      <div id="modalGrid" class="modal-grid"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
